name: Release On Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Read package metadata
        shell: bash
        run: |
          PKG_NAME=$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1, "Package"])')
          PKG_VERSION=$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1, "Version"])')
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"
          echo "PKG_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"

      - name: Build source package
        shell: bash
        run: R CMD build .

      - name: Create and push tag if needed
        shell: bash
        run: |
          TAG="v${PKG_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PKG_VERSION }}
          name: ${{ env.PKG_NAME }} v${{ env.PKG_VERSION }}
          generate_release_notes: true
          files: ./*.tar.gz
